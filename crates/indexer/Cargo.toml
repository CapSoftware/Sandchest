[package]
name = "sandchest-indexer"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Code index and tool daemon for Sandchest scans"

[lib]
name = "sandchest_indexer"
path = "src/lib.rs"

[[bin]]
name = "sandchest-index"
path = "src/main.rs"

[dependencies]
globset = "0.4"
ignore = "0.4"
memchr = "2"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
