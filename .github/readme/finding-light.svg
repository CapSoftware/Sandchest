<text x="32" y="33" fill="#8a775c" font-size="12">acme/api #418 · Add invoice download</text>
<rect x="705" y="25" width="5" height="5" fill="#d3c3a5"/><rect x="714" y="25" width="5" height="5" fill="#d3c3a5"/><rect x="723" y="25" width="5" height="5" fill="#d3c3a5"/>
<g class="finding9">
<g class="finding0"><rect x="32" y="67" width="12" height="12" fill="#fec242"/><text x="52" y="78" fill="#8a775c"><tspan fill="#15100b" font-weight="700">sandchest</tspan> commented on lines 14–15</text><rect x="32" y="97" width="48" height="18" fill="#d76839"/><text x="56" y="110" fill="#15100b" font-size="11" font-weight="700" text-anchor="middle">High</text><text x="92" y="110" fill="#8a775c">High confidence · CWE-639</text><text x="32" y="140" fill="#15100b" font-size="15" font-weight="700">Any signed-in user can read every customer’s invoices.</text></g><g class="finding1"><text x="32" y="176" fill="#8a775c" font-size="11" letter-spacing="1">ATTACK PATH</text></g><g class="finding2"><text x="32" y="202" fill="#8a775c">1</text><text x="52" y="202" fill="#a8700f">app/api/invoices/[id]/route.ts:13</text><text x="52" y="221" fill="#2a2016">The invoice ID comes straight from the URL.</text></g><g class="finding3"><text x="32" y="246" fill="#8a775c">2</text><text x="52" y="246" fill="#a8700f">lib/billing/invoices.ts:31</text><text x="52" y="265" fill="#2a2016">getInvoice looks it up by ID alone. Nothing checks who is asking.</text></g><g class="finding4"><text x="32" y="290" fill="#8a775c">3</text><text x="52" y="290" fill="#a8700f">app/api/invoices/[id]/route.ts:15</text><text x="52" y="309" fill="#2a2016">The whole invoice is returned, billing email included.</text></g><g class="finding5"><text x="32" y="348" fill="#8a775c" font-size="11" letter-spacing="1">PROOF OF CONCEPT</text><rect x="32.5" y="362.5" width="695" height="74" fill="#f7efe0" stroke="#eadfca"/><text x="46" y="386" fill="#2a2016" xml:space="preserve" style="white-space:pre">curl https://acme.app/api/invoices/inv_000001 \</text><text x="46" y="406" fill="#2a2016" xml:space="preserve" style="white-space:pre">  -H 'cookie: session=&lt;yours&gt;'</text><text x="46" y="426" fill="#8a775c"># 200 OK, another customer’s invoice</text></g><g class="finding6"><text x="32" y="470" fill="#8a775c" font-size="11" letter-spacing="1">THE FIX MUST GUARANTEE</text><text x="32" y="494" fill="#2a2016">An invoice only goes to members of the organisation that owns it.</text></g><g class="finding7"><rect x="32" y="512" width="260" height="26" fill="#fec242"/><rect x="32" y="512" width="260" height="2" fill="#fdd363"/><rect x="32" y="536" width="260" height="2" fill="#c25a2c"/><text x="162" y="529" fill="#15100b" font-weight="600" text-anchor="middle">Copy fix prompt for your agent</text></g><g class="finding8"><rect x="12" y="560" width="736" height="1" fill="#eadfca"/><text x="32" y="588" fill="#8a775c"><tspan fill="#b84c22" font-weight="700">✕</tspan>  <tspan fill="#2a2016" font-weight="700">Sandchest</tspan> found 1 high-severity issue</text></g>
</g>
