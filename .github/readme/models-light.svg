<text x="32" y="78" fill="#2a2016"><tspan fill="#8a775c">&gt;</tspan> Find a way into /api/invoices</text><rect x="12" y="94" width="736" height="1" fill="#eadfca"/><rect x="380" y="95" width="1" height="172" fill="#eadfca"/><rect x="32" y="116" width="8" height="8" fill="#d3c3a5"/><text x="48" y="125" fill="#8a775c">Stock model</text><rect x="400" y="116" width="8" height="8" fill="#fec242" class="blink"/><text x="416" y="125" fill="#a8700f">Abliterated model</text><clipPath id="type-32-157"><rect x="30" y="143" width="264" height="19"/></clipPath><text x="32" y="157" xml:space="preserve" style="white-space:pre"><tspan fill="#8a775c">I can’t help with breaking into</tspan></text><g clip-path="url(#type-32-157)"><rect x="30" y="143" width="264" height="19" fill="#fffbf3" class="models0" style="transform:translateX(264px)"/></g><clipPath id="type-32-179"><rect x="30" y="165" width="256" height="19"/></clipPath><text x="32" y="179" xml:space="preserve" style="white-space:pre"><tspan fill="#8a775c">systems. In general, make sure</tspan></text><g clip-path="url(#type-32-179)"><rect x="30" y="165" width="256" height="19" fill="#fffbf3" class="models1" style="transform:translateX(256px)"/></g><clipPath id="type-32-201"><rect x="30" y="187" width="264" height="19"/></clipPath><text x="32" y="201" xml:space="preserve" style="white-space:pre"><tspan fill="#8a775c">your routes check authorization</tspan></text><g clip-path="url(#type-32-201)"><rect x="30" y="187" width="264" height="19" fill="#fffbf3" class="models2" style="transform:translateX(264px)"/></g><clipPath id="type-32-223"><rect x="30" y="209" width="296" height="19"/></clipPath><text x="32" y="223" xml:space="preserve" style="white-space:pre"><tspan fill="#8a775c">and follow security best practices.</tspan></text><g clip-path="url(#type-32-223)"><rect x="30" y="209" width="296" height="19" fill="#fffbf3" class="models3" style="transform:translateX(296px)"/></g><clipPath id="type-400-157"><rect x="398" y="143" width="216" height="19"/></clipPath><text x="400" y="157" xml:space="preserve" style="white-space:pre"><tspan fill="#8a775c">$ </tspan><tspan fill="#2a2016">curl /api/invoices/1043</tspan></text><g clip-path="url(#type-400-157)"><rect x="398" y="143" width="216" height="19" fill="#fffbf3" class="models4" style="transform:translateX(216px)"/></g><clipPath id="type-400-179"><rect x="398" y="165" width="272" height="19"/></clipPath><text x="400" y="179" xml:space="preserve" style="white-space:pre"><tspan fill="#8a775c">    -H 'Cookie: session=&lt;yours&gt;'</tspan></text><g clip-path="url(#type-400-179)"><rect x="398" y="165" width="272" height="19" fill="#fffbf3" class="models5" style="transform:translateX(272px)"/></g><clipPath id="type-400-201"><rect x="398" y="187" width="248" height="19"/></clipPath><text x="400" y="201" xml:space="preserve" style="white-space:pre"><tspan fill="#a8700f">200 OK </tspan><tspan fill="#2a2016">someone else’s invoice</tspan></text><g clip-path="url(#type-400-201)"><rect x="398" y="187" width="248" height="19" fill="#fffbf3" class="models6" style="transform:translateX(248px)"/></g><g class="models7"><rect x="400" y="222" width="72" height="18" fill="#d76839"/><text x="436" y="235" fill="#15100b" font-size="11" font-weight="700" text-anchor="middle">Critical</text><text x="484" y="235" fill="#15100b">Any user, any invoice</text></g>
